<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>邮件验证码</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
    }

    .view {
      width: 100vw;
      height: 100vh;
    }

    .card {
      width: 500px;
      height: 300px;
      border-radius: 5px;

      background-color: #2f89fc;
      box-shadow: 0px 0px 5px 2px rgba(0, 0, 0, 0.2);

      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      overflow: hidden;
    }

    .card_title {
      color: white;
      margin-left: 10px;
    }

    .card_title_svg {
      margin-top: 5px;
    }
    
    .card_title_view {
      width: auto;
      height: 40px;
      padding: 20px;

      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-direction: row;

      background-color: transparent;
    }

    .card_view {
      width: auto;
      height: 180px;
      padding: 20px;

      background-color: white;
    }

    .captcha {
      margin: 15px;
      padding: 10px;
      border-radius: 5px;
      border-left: 2px solid #2f89fc;
      border-right: 2px solid #2f89fc;

      text-align: center;

      background-color: ghostwhite;
    }

    .card_tips {
      border-top: 2px dashed #2f89fc;
      padding-top: 5px;
    }
  </style>
  <body class="view">
    <div class="card">
      <div class="card_title_view">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16"
          width="32"
          height="32"
          class="card_title_svg"
        >
          <path
            d="M2.5 2C1.675781 2 1 2.675781 1 3.5L1 11.5C1 12.324219 1.675781 13 2.5 13L13.5 13C14.324219 13 15 12.324219 15 11.5L15 3.5C15 2.675781 14.324219 2 13.5 2 Z M 2.5 3L13.5 3C13.535156 3 13.5625 3.011719 13.59375 3.019531L8 6.890625L2.40625 3.019531C2.4375 3.011719 2.464844 3 2.5 3 Z M 2 3.953125L8 8.109375L14 3.953125L14 11.5C14 11.78125 13.78125 12 13.5 12L2.5 12C2.21875 12 2 11.78125 2 11.5Z"
            fill="white"
          />
        </svg>
        <h3 class="card_title">用户注册验证码</h3>
      </div>
      <div class="card_view">
        <p>您的验证码是:</p>
        <div class="captcha">
          <h1>$captcha$</h1>
        </div>
        <div class="card_tips">
          <p>
            验证码有效时间为5分钟，为了保障您的账号安全，请不要将验证码泄露给他人
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
